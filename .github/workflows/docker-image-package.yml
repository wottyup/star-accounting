name: Publish Docker Images

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "!v*-dev.*"
  workflow_dispatch:
    inputs:
      image_version:
        description: "Optional version tag to publish (for example 0.10.0-beta.1)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Web/API images to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and publish images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ inputs.image_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${IMAGE_VERSION:-}" ]]; then
            version="$IMAGE_VERSION"
          else
            version="$(node -p 'require("./app/version.json").dev.versionName')"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $version" >&2
            exit 1
          fi

          case "$version" in
            *-dev.*) build_channel="dev" ;;
            *-beta.*) build_channel="beta" ;;
            *) build_channel="stable" ;;
          esac

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          api_image="ghcr.io/$owner/star-accounting-api"
          web_image="ghcr.io/$owner/star-accounting-web"
          short_sha="${GITHUB_SHA:0:7}"
          build_tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          export STAR_ACCOUNTING_API_IMAGE="$api_image"
          export STAR_ACCOUNTING_WEB_IMAGE="$web_image"
          export STAR_ACCOUNTING_IMAGE_TAG="$build_tag"
          export STARK_BUILD_CHANNEL="$build_channel"
          docker compose -p wotty-staraccounting build api-runtime web

          tags=("$version" "sha-$short_sha")
          if [[ "$version" != *-* ]]; then
            tags+=("${version%.*}" "latest")
          fi

          for image in "$api_image" "$web_image"; do
            for tag in "${tags[@]}"; do
              docker tag "$image:$build_tag" "$image:$tag"
              docker push "$image:$tag"
            done
          done
