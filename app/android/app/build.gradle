apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def versionConfig = new groovy.json.JsonSlurper().parse(new File(rootProject.projectDir.parentFile, 'version.json'))
def buildChannel = System.getenv('STARK_BUILD_CHANNEL') ?: 'dev'
if (!(buildChannel in ['dev', 'beta', 'stable'])) throw new GradleException("Unknown build channel: ${buildChannel}")
def selectedVersion = buildChannel == 'dev' ? versionConfig.dev : versionConfig.public
if (buildChannel != 'dev' && ((buildChannel == 'beta') != selectedVersion.versionName.contains('-beta.') || selectedVersion.versionCode != versionConfig.lastVersionCode)) {
    throw new GradleException('Public version is stale or channel does not match; run pnpm version:reserve for the matching public channel.')
}

android {
    namespace "com.wotty.stark.web"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wotty.stark.web"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode selectedVersion.versionCode as int
        versionName selectedVersion.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "edition"
    productFlavors {
        web {
            dimension "edition"
            applicationId "com.wotty.stark.web"
            manifestPlaceholders = [
                appLabel: "星会计 Web 壳",
                appActivityName: "com.wotty.stark.web.MainActivity"
            ]
        }
        ktweb {
            dimension "edition"
            applicationId "com.wotty.stark.ktweb"
            manifestPlaceholders = [
                appLabel: "星会计",
                appActivityName: "com.wotty.stark.web.KtHybridActivity"
            ]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.register('verifyWebBuildVersion') {
    doLast {
        def metadataFile = file('src/main/assets/public/build-version.json')
        if (!metadataFile.exists()) throw new GradleException('Missing web version metadata; run the channel build and sync:android first.')
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        if (metadata.versionName != selectedVersion.versionName || metadata.versionCode != selectedVersion.versionCode || metadata.channel != buildChannel) {
            throw new GradleException('Web assets and Android version/channel do not match; rebuild and sync the selected channel.')
        }
    }
}
tasks.named('preBuild') { dependsOn('verifyWebBuildVersion') }

afterEvaluate {
    android.applicationVariants.all { variant ->
        if (variant.buildType.name == "debug") {
            def edition = variant.flavorName
            def outputApk = variant.outputs.first().outputFile
            def timestamp = new Date().format('yyyyMMdd-HHmmss-SSS') + '-' + java.util.UUID.randomUUID().toString()
            def archivedApkName = "wotty-stark-${edition}-debug-v${variant.versionName}-c${variant.versionCode}-${timestamp}.apk"
            def archiveTaskName = "archive${variant.name.capitalize()}Apk"

            tasks.register(archiveTaskName, Copy) {
                doFirst {
                    def destination = new File(rootProject.projectDir.parentFile.parentFile, "releases/${archivedApkName}")
                    if (destination.exists()) throw new GradleException('Refusing to overwrite an archived APK.')
                }
                from(outputApk)
                rename { archivedApkName }
                into(new File(rootProject.projectDir.parentFile.parentFile, "releases"))
            }

            tasks.named("assemble${variant.name.capitalize()}") {
                finalizedBy(archiveTaskName)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
